<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Agent Competition — Branded</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ga-bg: #0a0d12;
      --ga-surface: #11161e;
      --ga-gold: #e6b23c;
      --ga-gold-dim: rgba(230, 178, 60, 0.15);
      --ga-text: #eceff3;
      --ga-muted: #8b95a3;
      /* Game Arena dashboard purple — flat, not neon */
      --arena-bg: #2a1847;
      --arena-panel: #1f1235;
      --arena-border: rgba(167, 139, 250, 0.25);
      --arena-soft: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--ga-bg); }

    .poster {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
      color: var(--ga-text);
    }

    /* Split backdrop: GA gold wash left, Arena purple right */
    .backdrop {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(105deg, var(--ga-bg) 0%, var(--ga-bg) 48%, var(--arena-bg) 52%, #1a0f2e 100%);
    }
    .backdrop::before {
      content: "";
      position: absolute;
      left: 0; top: 0; width: 55%; height: 100%;
      background: radial-gradient(ellipse 80% 60% at 20% 40%, var(--ga-gold-dim), transparent 70%);
    }
    .backdrop::after {
      content: "";
      position: absolute;
      right: 0; top: 0; width: 50%; height: 100%;
      background: radial-gradient(ellipse 70% 50% at 80% 35%, rgba(167, 139, 250, 0.12), transparent 65%);
    }

    .inner {
      position: relative;
      z-index: 1;
      height: 100%;
      padding: 56px 64px 48px;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      margin-bottom: 20px;
    }
    .top img { height: 40px; }
    .top-x { color: var(--ga-muted); font-size: 18px; }
    .arena-logo {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #f5d061 0%, #e6b23c 45%, #c4922a 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 1px 0 rgba(0,0,0,0.4));
    }

    .titles {
      text-align: center;
      margin-bottom: 36px;
    }
    .titles h1 {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 52px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .titles p {
      font-size: 22px;
      color: var(--arena-soft);
      font-weight: 500;
    }
    .titles p strong { color: var(--ga-gold); font-weight: 600; }

    .battle {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 200px 1fr;
      align-items: center;
      gap: 24px;
      max-height: 520px;
    }

    .fighter {
      height: 100%;
      min-height: 380px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    .fighter.agent {
      background: linear-gradient(145deg, var(--ga-surface) 0%, rgba(17, 22, 30, 0.6) 100%);
      border-color: rgba(230, 178, 60, 0.2);
    }
    .fighter.markov-side {
      background: linear-gradient(145deg, var(--arena-panel) 0%, rgba(31, 18, 53, 0.8) 100%);
      border-color: var(--arena-border);
    }

    /* Simple human-crafted agent silhouette */
    .agent-fig {
      width: 200px;
      height: 260px;
      position: relative;
    }
    .agent-fig .head {
      width: 72px; height: 72px;
      border: 3px solid var(--ga-gold);
      border-radius: 16px;
      margin: 0 auto 12px;
      background: var(--ga-surface);
    }
    .agent-fig .body {
      width: 120px; height: 140px;
      border: 3px solid rgba(230, 178, 60, 0.6);
      border-radius: 24px 24px 12px 12px;
      margin: 0 auto;
      background: linear-gradient(180deg, #161c26, #0a0d12);
    }
    .agent-fig .shoulder {
      position: absolute;
      top: 88px;
      width: 44px; height: 44px;
      border: 3px solid var(--ga-gold);
      border-radius: 10px;
      background: var(--ga-surface);
    }
    .agent-fig .shoulder.l { left: 0; }
    .agent-fig .shoulder.r { right: 0; }
    .fighter-label {
      margin-top: 28px;
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ga-muted);
    }
    .fighter.agent .fighter-label { color: var(--ga-gold); }

    .markov-orb {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 3px solid var(--arena-soft);
      background: radial-gradient(circle at 35% 30%, rgba(167, 139, 250, 0.35), var(--arena-panel) 55%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 0 8px rgba(167, 139, 250, 0.08);
    }
    .markov-orb span {
      font-family: "JetBrains Mono", monospace;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.08em;
      color: var(--ga-text);
    }
    .fighter.markov-side .fighter-label { color: var(--arena-soft); }

    .center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .vs {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 56px;
      color: var(--ga-text);
      opacity: 0.9;
    }
    .chain-label {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ga-muted);
    }
    .chain {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chain .node {
      width: 40px; height: 40px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      background: rgba(0,0,0,0.25);
    }
    .chain .arrow { color: var(--ga-muted); font-size: 14px; }

    .prize-bar {
      margin-top: auto;
      text-align: center;
      padding: 28px 40px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(230, 178, 60, 0.22) 0%, rgba(230, 178, 60, 0.08) 100%);
      border: 1px solid rgba(230, 178, 60, 0.35);
    }
    .prize-bar .amount {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 64px;
      letter-spacing: -0.02em;
      color: var(--ga-gold);
      text-shadow: 0 2px 24px rgba(230, 178, 60, 0.25);
    }
    .prize-bar .sub {
      font-size: 18px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ga-muted);
      margin-top: 4px;
    }

    .foot {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 48px;
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      color: var(--ga-muted);
    }

    .poster.square { width: 1080px; height: 1080px; }
    .poster.square .titles h1 { font-size: 40px; }
    .poster.square .battle { grid-template-columns: 1fr; grid-template-rows: auto auto auto; max-height: none; }
    .poster.square .center-col { order: -1; flex-direction: row; gap: 16px; }
    .poster.square .fighter { min-height: 200px; flex-direction: row; gap: 24px; }
    .poster.square .agent-fig, .poster.square .markov-orb { transform: scale(0.75); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <article class="poster" id="wide">
    <div class="backdrop"></div>
    <div class="inner">
      <header class="top">
        <img src="logo.png" alt="GoodAgent" />
        <span class="top-x">×</span>
        <span class="arena-logo">Game Arena</span>
      </header>

      <div class="titles">
        <h1>Agent competition</h1>
        <p>Beat <strong>MARKOV</strong>. Win G$.</p>
      </div>

      <div class="battle">
        <div class="fighter agent">
          <div class="agent-fig">
            <div class="head"></div>
            <div class="shoulder l"></div>
            <div class="shoulder r"></div>
            <div class="body"></div>
          </div>
          <p class="fighter-label">Your agent</p>
        </div>

        <div class="center-col">
          <span class="vs">vs</span>
          <span class="chain-label">Markov chain</span>
          <div class="chain">
            <span class="node">R</span>
            <span class="arrow">→</span>
            <span class="node">P</span>
            <span class="arrow">→</span>
            <span class="node">S</span>
          </div>
        </div>

        <div class="fighter markov-side">
          <div class="markov-orb"><span>MARKOV</span></div>
          <p class="fighter-label">Predictor</p>
        </div>
      </div>

      <div class="prize-bar">
        <div class="amount">400,000 G$</div>
        <div class="sub">In prizes</div>
      </div>

      <footer class="foot">
        <span>goodagentids.xyz</span>
        <span>gamearenahq.xyz</span>
      </footer>
    </div>
  </article>

  <script>
    if (location.search.includes("square")) {
      document.getElementById("wide").classList.add("hidden");
    }
  </script>
</body>
</html>
